openapi: 3.0.0
info: { title: Mock API, version: 1.0.0 }
servers: [{ url: http://localhost:4100 }]
paths:
  /users:
    post:
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string }
                email: { type: string, format: email }
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required: [id, email]
                properties:
                  id: { type: string }
                  email: { type: string }
                  name: { type: string, nullable: true }
        '422':
          content:
            application/json:
              schema:
                type: object
                required: [errors]
                properties:
                  errors: { type: array, items: { type: string } }
        '401':
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string } } }
  /users/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required: [id, email]
                properties:
                  id: { type: string }
                  email: { type: string }
                  name: { type: string }
        '404':
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string } } }
  /orders:
    post:
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required: [id, product, status]
                properties:
                  id: { type: string }
                  product: { type: string }
                  status: { type: string, enum: [pending, completed, cancelled] }
        '403':
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string } } }
