name: Publish (manual fallback)

# Primary release flow lives in `release.yml` (changesets-driven). This
# workflow is kept as a manual emergency control — e.g. to re-run a failed
# publish, or to publish a specific package whose changeset slipped. Tag
# pushes no longer trigger this; per-package tags are now created by
# `changeset publish` in release.yml.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run npm publish --dry-run (no actual publish to npm)"
        type: boolean
        default: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    # Job-level env so every step sees the npm auth token.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure npm auth (multi-path)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Fail fast if secret is empty or unset.
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is empty or not set in repo Settings → Secrets and variables → Actions"
            exit 1
          fi

          # Write the auth token ONLY to $HOME. A workspace-rooted token risks
          # being git-added by downstream steps (changesets/action etc.) and
          # leaking publicly. npm publish reads $HOME/.npmrc (merged with the
          # committed token-free project .npmrc).
          NPMRC_CONTENT="//registry.npmjs.org/:_authToken=${NPM_TOKEN}
          registry=https://registry.npmjs.org/
          always-auth=true"

          echo "$NPMRC_CONTENT" > "$HOME/.npmrc"
          chmod 600 "$HOME/.npmrc"

          # Sanity verification (no token leak — show file size + first non-secret line).
          echo "Auth file written:"
          ls -la "$HOME/.npmrc"
          echo "Registry config (no token in this line):"
          grep "^registry=" "$HOME/.npmrc"

      - name: Install dependencies
        run: npm ci

      - name: Safety gate — lint + typecheck + test
        run: |
          npm run lint
          npm run typecheck
          npm run test

      - name: Plan publish (skip versions already on npm)
        id: plan
        run: |
          # For each package, set publish_<pkg>=true/false based on whether the
          # local version is already published. Probes the version-specific
          # registry URL (404 = not published yet, 200 = already published).
          # On dry-run we publish all packages so the workflow exercises every
          # build step end-to-end.
          for pkg in web core http cli skills prompts; do
            local_v=$(jq -r .version packages/$pkg/package.json)
            if [ "${{ inputs.dry-run }}" = "true" ]; then
              echo "@xera-ai/$pkg: local=$local_v (dry-run → will publish)"
              echo "publish_$pkg=true" >> "$GITHUB_OUTPUT"
              continue
            fi
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/@xera-ai/$pkg/$local_v")
            if [ "$status" = "200" ]; then
              echo "@xera-ai/$pkg: $local_v already on npm → skip"
              echo "publish_$pkg=false" >> "$GITHUB_OUTPUT"
            elif [ "$status" = "404" ]; then
              echo "@xera-ai/$pkg: $local_v not on npm → publish"
              echo "publish_$pkg=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::@xera-ai/$pkg: unexpected HTTP $status probing $local_v"
              exit 1
            fi
          done

      - name: Publish @xera-ai/web
        if: steps.plan.outputs.publish_web == 'true'
        working-directory: packages/web
        run: |
          rm -rf dist
          npm run build
          npx tsc --declaration --emitDeclarationOnly --outDir dist
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi

      - name: Publish @xera-ai/core
        if: steps.plan.outputs.publish_core == 'true'
        working-directory: packages/core
        run: |
          rm -rf dist
          npm run build
          npx tsc --emitDeclarationOnly
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi

      - name: Publish @xera-ai/http
        if: steps.plan.outputs.publish_http == 'true'
        working-directory: packages/http
        run: |
          rm -rf dist
          npm run build
          npx tsc --declaration --emitDeclarationOnly --outDir dist
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi

      - name: Publish @xera-ai/cli
        if: steps.plan.outputs.publish_cli == 'true'
        working-directory: packages/cli
        run: |
          rm -rf dist
          npm run build
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi

      - name: Publish @xera-ai/skills
        if: steps.plan.outputs.publish_skills == 'true'
        working-directory: packages/skills
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi

      - name: Publish @xera-ai/prompts
        if: steps.plan.outputs.publish_prompts == 'true'
        working-directory: packages/prompts
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi

      - name: Verify versions landed on npm
        if: ${{ !inputs.dry-run }}
        run: |
          sleep 15  # give npm registry CDN time to propagate
          failed=0
          for pkg in web core http cli skills prompts; do
            local_v=$(jq -r .version packages/$pkg/package.json)
            npm_v=$(curl -s https://registry.npmjs.org/@xera-ai/$pkg/latest | jq -r .version)
            if [ "$local_v" != "$npm_v" ]; then
              echo "::error::@xera-ai/$pkg version mismatch: local=$local_v npm=$npm_v"
              failed=1
            else
              echo "@xera-ai/$pkg @ $npm_v ✓"
            fi
          done
          exit $failed
