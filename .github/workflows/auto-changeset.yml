name: Auto-changeset

# Generate a changeset on every PR (or update it when the PR title changes),
# unless the PR author has already added a manual one. Driven by conventional-
# commit PR titles. See `scripts/auto-changeset.mjs` for the rules.
#
# Only runs on PRs from the same repo (not forks) because the workflow needs
# write access to push the generated changeset back to the PR branch.
# External-contributor PRs fall back to the manual `npx changeset` flow,
# which changeset-bot will flag via PR comment.
#
# Uses the `xera-automation` GitHub App for the push so the resulting commit
# is attributed to the app and TRIGGERS downstream workflows (test,
# graph-viewer). Pushes made with the default GITHUB_TOKEN do not trigger
# other workflows, which would leave required checks stuck "expected".

on:
  pull_request:
    types: [opened, synchronize, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: auto-changeset-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.XERA_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.XERA_AUTOMATION_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate changeset
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/auto-changeset.mjs

      - name: Commit changeset to PR branch
        run: |
          if [ -z "$(git status --porcelain .changeset/)" ]; then
            echo "No changeset changes to commit."
            exit 0
          fi
          git config user.name 'xera-automation[bot]'
          git config user.email '${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git add .changeset/
          git commit -m "chore: auto-generate changeset for #${{ github.event.pull_request.number }}"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
