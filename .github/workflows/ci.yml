name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `code` is "everything except docs-only changes". Skill/prompt .md
          # under packages/ are NOT excluded — they ship to users and are
          # validated by tests (verify-prompts, doctor, init-shapes).
          filters: |
            code:
              - '!docs/**'
              - '!*.md'
              - '!.changeset/**'
              - '!**/CHANGELOG.md'
      - uses: oven-sh/setup-bun@v2
        if: steps.filter.outputs.code == 'true'
        with: { bun-version: '1.3.x' }
      - if: steps.filter.outputs.code == 'true'
        run: bun install --frozen-lockfile
      - if: steps.filter.outputs.code == 'true'
        run: bun run lint
      - if: steps.filter.outputs.code == 'true'
        run: bun run typecheck
      - if: steps.filter.outputs.code == 'true'
        run: bun run test
