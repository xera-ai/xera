name: Nightly E2E
on:
  schedule: [{ cron: '17 2 * * *' }]
  workflow_dispatch:
jobs:
  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build workspace (cli bin requires dist/)
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run web integration tests
        run: npx vitest run packages/cli/test/integration
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xera-e2e-web-artifacts
          path: |
            **/.xera/**/runs/**
            **/playwright-report

  # v0.7: HTTP adapter end-to-end against bundled mock-api (no browser needed)
  e2e-http:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build workspace
        run: npm run build
      - name: HTTP adapter integration tests (boots mock-api)
        env:
          XERA_RUN_INTEGRATION: '1'
        run: npx vitest run packages/http/test/integration
      - name: Classifier golden HTTP tickets
        run: npx vitest run packages/core/test/classifier/golden-http.test.ts
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xera-e2e-http-artifacts
          path: |
            **/.xera/**/runs/**
