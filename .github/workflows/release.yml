name: Release

# Changesets-driven release pipeline.
#
# On every push to main:
#   - If there are unconsumed .changeset/*.md files, opens (or updates) a
#     "Version Packages" PR that bumps versions + updates CHANGELOG.md.
#   - When that PR is merged (so versions are now on main with no changesets
#     remaining), runs `npm run release` which builds all packages and
#     publishes any whose local version isn't already on npm. Per-package
#     git tags (`@xera-ai/<pkg>@<version>`) are created automatically by
#     `changeset publish`.
#
# Manual emergency publishes still work via `publish.yml` (workflow_dispatch).

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.XERA_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.XERA_AUTOMATION_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is not set"
            exit 1
          fi
          # WRITE THE AUTH TOKEN ONLY TO $HOME — never to $GITHUB_WORKSPACE.
          # The repo commits a token-free .npmrc (save-exact + legacy-peer-deps);
          # the token line must stay in $HOME/.npmrc so `changesets/action`'s
          # `git add -A` can't sweep it into the Version Packages PR. npm
          # publish merges $HOME/.npmrc with the project one.
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          chmod 600 "$HOME/.npmrc"

      - name: Install dependencies
        run: npm ci

      - name: Safety gate — lint + typecheck + test
        run: |
          npm run lint
          npm run typecheck
          npm run test

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: npm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create combined GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION=$(jq -r .version packages/cli/package.json)
          TAG="v${VERSION}"

          # Extract the latest changelog section from cli (representative for all packages)
          NOTES=$(awk '/^## /{count++; if(count==2) exit} count==1{print}' packages/cli/CHANGELOG.md | tail -n +2)

          # Write notes to a temp file (echo avoids printf's option parsing of leading -)
          {
            echo "## Packages"
            echo ""
            echo "All packages updated to \`${VERSION}\`:"
            echo "- \`@xera-ai/cli\`"
            echo "- \`@xera-ai/core\`"
            echo "- \`@xera-ai/web\`"
            echo "- \`@xera-ai/http\`"
            echo "- \`@xera-ai/prompts\`"
            echo "- \`@xera-ai/skills\`"
            echo ""
            echo "## Changes"
            echo ""
            echo "$NOTES"
          } > /tmp/release-notes.md

          gh release create "$TAG" \
            --title "xera v${VERSION}" \
            --notes-file /tmp/release-notes.md
