name: Release

# Changesets-driven release pipeline.
#
# On every push to main:
#   - If there are unconsumed .changeset/*.md files, opens (or updates) a
#     "Version Packages" PR that bumps versions + updates CHANGELOG.md.
#   - When that PR is merged (so versions are now on main with no changesets
#     remaining), runs `bun run release` which builds all packages and
#     publishes any whose local version isn't already on npm. Per-package
#     git tags (`@xera-ai/<pkg>@<version>`) are created automatically by
#     `changeset publish`.
#
# Manual emergency publishes still work via `publish.yml` (workflow_dispatch).

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.x' }

      - name: Configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is not set"
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$GITHUB_WORKSPACE/.npmrc"
          chmod 600 "$HOME/.npmrc" "$GITHUB_WORKSPACE/.npmrc"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Safety gate — lint + typecheck + test
        run: |
          bun run lint
          bun run typecheck
          bun run test

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: bunx changeset version
          publish: bun run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
